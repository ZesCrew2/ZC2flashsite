<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">

<head>
	<title>The ZesCrew2 Microsite!!</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" href="https://unpkg.com/7.css/dist/7.scoped.css">
	<link rel="preload" href="assets/css/main.css" as="style">
	<link rel="preload" href="assets/img/loading_indicator.gif" as="image">
	<link rel="stylesheet" href="assets/css/main.css">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>

<body>
	<div id="swirl"></div>
	<div id="site">
		<div id="logo-layer">
			<div id="logo-idle-wrap" onclick="loadSwf('orange')">
				<img src="assets/img/zc2aeroorb.png" alt="ZC2 Logo" id="logo">
			</div>
		</div>
		<div id="site-inner">
			<div id="banner">
				<img class="background" src="assets/img/banner/banner.png">
				<div class="object-wrap">
					<object type="application/x-shockwave-flash" data="assets/swf/banner.swf" width="732" height="100">
						<param name="movie" value="banner.swf">
						<param name="wmode" value="transparent">
					</object>
				</div>
			</div>
			<div id="buttons">
				<button class="btn red" onclick="loadSwf('red')">Introduction</button>
				<button class="btn orange" onclick="loadSwf('orange')">Home</button>
				<button class="btn yellow" onclick="loadSwf('yellow')">Art</button>
				<button class="btn lime" onclick="loadSwf('lime')">Videos</button>
				<button class="btn green" onclick="loadSwf('green')">Downloads</button>
				<button class="btn cyan" onclick="loadSwf('cyan')">Oldies</button>
				<button class="btn blue" onclick="loadSwf('blue')">2006 (Album)</button>
				<button class="btn purple" onclick="loadSwf('purple')">Socials</button>
				<button class="btn pink" onclick="loadSwf('pink')">Site Credits</button>
				<img src="assets/img/speaker.png" alt="Mute Toggle" id="speaker">
			</div>
			<div id="content-area">
				<div id="flashContent">
					<object data="/assets/swf/pages/orange.swf" type="application/x-shockwave-flash" width="100%" height="100%"></object>
				</div>
			</div>
			<div id="footer">
				<p>Site CSS by <a href="https://sploder-saptarshi.github.io/" class="link"
						target="_blank" title="https://sploder-saptarshi.github.io/"
						tabindex="0"><span class="saptarshi-text">Saptarshi</span></a> and <a href="https://www.youtube.com/@thornsmusicvevo" class="link"
						target="_blank" title="https://www.youtube.com/@thornsmusicvevo"
						tabindex="0"><span class="thorns-text"><span style="animation-delay: 0.0s;">T</span><span style="animation-delay: 0.2s;">h</span><span style="animation-delay: 0.4s;">o</span><span style="animation-delay: 0.6s;">r</span><span style="animation-delay: 0.8s;">n</span><span style="animation-delay: 1.0s;">s</span></span></a></p>
			</div>
		</div>
	</div>
	<div class="win7">
		<div id="music-player" class="window glass active" style="--w7-w-bg: #FFA500;">
			<div class="title-bar">
				<div class="title-bar-text">Windows Media Player</div>
				<div class="title-bar-controls">
					<button aria-label="Minimize"></button>
					<button aria-label="Maximize"></button>
					<button aria-label="Close"></button>
				</div>
			</div>
			<div class="window-body">
				<p>Current Music Playing: <br /><strong id="track-name">Virgill - Interference Ending</strong></p>
				<div class="player-controls" style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
					<button id="btn-prev" style="min-width: 32px;">|&lt;</button>
					<button id="btn-play-pause" style="min-width: 32px;">Pause</button>
					<button id="btn-next" style="min-width: 32px;">&gt;|</button>
				</div>
				<div class="progress-container" style="margin-top: 10px; height: 12px; background: #eee; border: 1px solid #999; cursor: pointer; position: relative;">
					<div id="progress-bar" style="height: 100%; width: 0%; background: #0078d7; transition: width 0.1s linear;"></div>
				</div>
				<div style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
					<span>Volume:</span>
					<input type="range" id="volume-slider" min="0" max="100" value="50" style="width: 100px;">
				</div>
			</div>
			<div class="status-bar">
				<p class="status-bar-field">Status: Playing</p>
				<p class="status-bar-field">Volume: 50%</p>
			</div>
		</div>

		<button id="music-restore">
			Windows Media Player
		</button>
	</div>

	<script>
		function loadSwf(color) {
			const flashContent = document.getElementById('flashContent');
			flashContent.innerHTML = '<object data="assets/swf/pages/' + color + '.swf" type="application/x-shockwave-flash" width="100%" height="100%"></object>';
		}
		loadSwf('orange');
		function scaleSite() {
			var site = document.getElementById('site');
			var inner = document.getElementById('site-inner');
			var logoLayer = document.getElementById('logo-layer');
			var scale = site.clientWidth / 760;
			inner.style.transform = 'scale(' + scale + ')';
			if (logoLayer) logoLayer.style.transform = 'scale(' + scale + ')';
		}
		window.addEventListener('resize', scaleSite);
		scaleSite();
	</script>
	<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
	<script>
		var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
		window.RufflePlayer.config = {
			"autoplay": "on",
			"unmuteOverlay": "hidden",
			"contextMenu": "off",
			"splashScreen": false,
			...(isMobile && { "quality": "low" }),
		}
	</script>
	<script src="assets/js/playlist.js"></script>
	<script src="assets/js/speaker.js"></script>
	<script src="assets/js/sounds.js"></script>
	<script src="assets/js/logo.js"></script>
	<script src="assets/js/title.js"></script>
</body>

</html>
