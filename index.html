<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
	<head>
		<title>Welcome to ZC2!!</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="stylesheet" type="text/css" href="assets/css/main.css" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<style type="text/css" media="screen">
		
		</style>
	</head>
	<body>
		<div id="site">
			<img src="assets/img/zc2aeroorb.png" alt="ZC2 Logo" id="logo">
			<div id="banner">
				<object type="application/x-shockwave-flash" data="assets/swf/banner.swf" width="732" height="100">
					<param name="movie" value="banner.swf">
					<param name="wmode" value="transparent">
				</object>
			</div>
			<div id="buttons">
				<button class="btn red" onclick="loadSwf('red')">test</button>
				<button class="btn orange" onclick="loadSwf('orange')">test</button>
				<button class="btn yellow" onclick="loadSwf('yellow')">test</button>
				<button class="btn lime" onclick="loadSwf('lime')">test</button>
				<button class="btn green" onclick="loadSwf('green')">test</button>
				<button class="btn cyan" onclick="loadSwf('cyan')">test</button>
				<button class="btn blue" onclick="loadSwf('blue')">test</button>
				<button class="btn purple" onclick="loadSwf('purple')">test</button>
				<button class="btn pink" onclick="loadSwf('pink')">Site Credits</button>
			</div>
			<div id="content-area">
				<div id="flashContent">
					<object data="/assets/swf/pages/red.swf" type="application/x-shockwave-flash" width="100%" height="100%"></object>
				</div>
			</div>
			<div id="footer">
			  <p>Site CSS by Saptarshi - <a href="https://sploder-saptarshi.github.io/" rel="noreferrer noopener" target="_blank" title="https://sploder-saptarshi.github.io/" role="link" tabindex="0">https://sploder-saptarshi.github.io</a>			</p>
			</div>
		</div>
		<script>
			function loadSwf(color) {
				flashContent.innerHTML = '<object data="/assets/swf/pages/' + color + '.swf" type="application/x-shockwave-flash" width="100%" height="100%"></object>';
			}
			loadSwf('red');
		</script>
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
		<script>
			window.RufflePlayer.config = {
				"autoplay": "on",
				"unmuteOverlay": "hidden",
				"contextMenu": "off",
			}
		</script>
	</body>
</html>
