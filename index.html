<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
	<head>
		<title>Welcome to ZC2!!</title>
		<link rel="icon" type="image/png" href="favicon.png">
		<link rel="stylesheet" type="text/css" href="assets/css/main.css" />
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<style type="text/css" media="screen">
		
		</style>
	</head>
	<body>
		<div id="site">
			<img src="favicon.png" alt="ZC2 Logo" id="logo">
			<div id="banner">
				<object type="application/x-shockwave-flash" data="banner.swf" width="760" height="100">
					<param name="movie" value="banner.swf">
					<param name="wmode" value="transparent">
				</object>
			</div>
			<div id="buttons">
				<button class="btn red">test</button>
				<button class="btn orange">test</button>
				<button class="btn yellow">test</button>
				<button class="btn lime">test</button>
				<button class="btn green">test</button>
				<button class="btn cyan">test</button>
				<button class="btn blue">test</button>
				<button class="btn purple">test</button>
				<button class="btn pink">test</button>
			</div>
			<div id="content-area">
				<div id="flashContent">
					<object classid="clsid:d27cdb6e-ae6d-11cf-96b8-444553540000" width="100%" height="100%" id="siteobj" align="middle">
						<param name="movie" value="/site.swf" />
						<param name="quality" value="high" />
						<param name="bgcolor" value="#ffffff" />
						<param name="play" value="true" />
						<param name="loop" value="true" />
						<param name="wmode" value="window" />
						<param name="scale" value="showall" />
						<param name="menu" value="true" />
						<param name="devicefont" value="false" />
						<param name="salign" value="" />
						<param name="allowScriptAccess" value="sameDomain" />
					</object>
				</div>
			</div>
			<div id="footer">site credits</div>
		</div>
		<script>
			var noCache = '?nocache=' + new Date().getTime();
			var object = document.getElementById('siteobj');
			var param = object.querySelector('param[name="movie"]');
			param.setAttribute('value', '/site.swf' + noCache);
		</script>
		<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
		<script>
			window.RufflePlayer.config = {
				"autoplay": "on",
				"unmuteOverlay": "hidden",
				"contextMenu": "off",
			}
		</script>
	</body>
</html>
