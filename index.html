<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">

<head>
	<title>The ZesCrew2 Microsite!!</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<link rel="stylesheet" href="https://unpkg.com/7.css/dist/7.scoped.css">
	<link rel="preload" href="assets/css/main.css" as="style">
	<link rel="preload" href="assets/img/loading_indicator.gif" as="image">
	<link rel="preload" href="assets/wmp/wmplayer.css" as="style">
	<link rel="preload" href="assets/wmp/wmplayer.buttons.css" as="style">
	<link rel="preload" href="assets/wmp/wmplayer.slider.css" as="style">
	<link rel="stylesheet" href="assets/css/main.css">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>

<body>
	<div id="swirl"></div>
	<div id="site">
		<div id="logo-layer">
			<div id="logo-idle-wrap" onclick="loadPage('orange')">
				<img src="assets/img/zc2aeroorb.png" alt="ZC2 Logo" id="logo">
			</div>
		</div>
		<div id="site-inner">
			<div id="banner">
				<img class="background" src="assets/img/banner/banner.png">
				<div class="object-wrap">
					<div id="banner-animation_container">
						<canvas id="banner-canvas" width="761" height="93" style="position:absolute;display:block;background:transparent;"></canvas>
						<div id="banner-dom_overlay_container" style="pointer-events:none;overflow:hidden;width:761px;height:93px;position:absolute;left:0;top:0;display:block;"></div>
					</div>
				</div>
			</div>
			<div id="buttons">
				<button class="btn red" onclick="loadPage('red')">Introduction</button>
				<button class="btn orange" onclick="loadPage('orange')">Home</button>
				<button class="btn yellow" onclick="loadPage('yellow')">Art</button>
				<button class="btn lime" onclick="loadPage('lime')">Videos</button>
				<button class="btn green" onclick="loadPage('green')">Downloads</button>
				<button class="btn cyan" onclick="loadPage('cyan')">Oldies</button>
				<button class="btn blue" onclick="loadPage('blue')">2006 (Album)</button>
				<button class="btn purple" onclick="loadPage('purple')">Socials</button>
				<button class="btn pink" onclick="loadPage('pink')">Site Credits</button>
				<img src="assets/img/speaker.png" alt="Mute Toggle" id="speaker">
			</div>
			<div id="content-area">
				<div id="flashContent"></div>
			</div>
			<div id="footer">
				<p>Site CSS by <a href="https://sploder-saptarshi.github.io/" class="link"
						target="_blank" title="https://sploder-saptarshi.github.io/"
						tabindex="0"><span class="saptarshi-text">Saptarshi</span></a> and <a href="https://www.youtube.com/@thornsmusicvevo" class="link"
						target="_blank" title="https://www.youtube.com/@thornsmusicvevo"
						tabindex="0"><span class="thorns-text"><span style="animation-delay: 0.0s;">T</span><span style="animation-delay: 0.2s;">h</span><span style="animation-delay: 0.4s;">o</span><span style="animation-delay: 0.6s;">r</span><span style="animation-delay: 0.8s;">n</span><span style="animation-delay: 1.0s;">s</span></span></a></p>
			</div>
		</div>
	</div>
	<div class="win7">
		<div id="music-player" class="window glass active" style="--w7-w-bg: #FFA500; width: 380px;">
			<div class="title-bar">
				<div class="title-bar-text">Windows Media Player</div>
				<div class="title-bar-controls">
					<button aria-label="Minimize"></button>
					<button aria-label="Maximize"></button>
					<button aria-label="Close"></button>
				</div>
			</div>
			<div class="window-body">
				<wm-player id="wmp" data-controls-in-tray-left="shuffle loop separator stop prev" data-controls-in-tray-right="next mute volume" data-controls-in-gutter-right="" style="--max-video-height: 0; --min-video-height: 0; --scale: 0.75;"></wm-player>
			</div>
		</div>

		<button id="music-restore">
			Windows Media Player
		</button>
	</div>
	<script src="assets/js/createjs.min.js"></script>
	<script src="assets/swf/banner/zc2banner.js"></script>
	<script src="assets/wmp/wmplayer.playlist.js"></script>
	<script src="assets/wmp/wmplayer.slider.js"></script>
	<script src="assets/wmp/wmplayer.js"></script>
	<script src="assets/js/banner.js"></script>
	<script src="assets/js/playlist.js"></script>
	<script src="assets/js/speaker.js"></script>
	<script src="assets/js/sounds.js"></script>
	<script src="assets/js/logo.js"></script>
	<script src="assets/js/title.js"></script>
	<script src="assets/js/pageloader.js"></script>
</body>

</html>
